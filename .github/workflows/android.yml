# Builds the Android app on GitHub's servers (they have the Android SDK; your PC does not need Android Studio).
#   * LearnQuest-test.apk      -> install on any phone to try the app (always built)
#   * LearnQuest-release.aab   -> the file you upload to Google Play Console (signed when the 4 secrets below exist)
#   * LearnQuest-release.apk   -> the same signed build as an APK, for testing the real thing (only when signed)
#
# One-time setup: Settings -> Secrets and variables -> Actions
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Variable (optional): LQ_API_BASE = https://your-server.up.railway.app   (empty = the app plays offline without accounts)
# Run it: Actions -> "Build Android app" -> Run workflow.  Download the files at the bottom of the finished run ("Artifacts").
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to people in Play (for example 1.0.0)"
        default: "1.0.0"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "scripts/app-files.mjs"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LQ_API_BASE: ${{ vars.LQ_API_BASE }}
      LQ_VERSION_CODE: ${{ github.run_number }}
      LQ_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Game files (three.js) and Capacitor
        run: |
          npm ci --omit=dev --ignore-scripts
          npm --prefix mobile ci

      - name: Copy the game into the Android project
        working-directory: mobile
        run: |
          node scripts/sync-web.mjs
          npx cap sync android

      - name: Android SDK 36 (required by Google Play)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Upload key (only if the secrets exist)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "LQ_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "LQ_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "LQ_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "LQ_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "SIGNED=no" >> "$GITHUB_ENV"
            echo "::warning::No upload key secrets: the .aab will be UNSIGNED and Google Play will refuse it. See PLAYSTORE_GUIDE.md, step 2."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (test APK + Play bundle)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          if [ "$SIGNED" = "yes" ]; then ./gradlew --no-daemon assembleRelease; fi

      - name: Collect the files and check them
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/LearnQuest-test.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab out/LearnQuest-release.aab
          if [ "$SIGNED" = "yes" ]; then cp mobile/android/app/build/outputs/apk/release/app-release.apk out/LearnQuest-release.apk; fi
          AAPT2="$(ls $ANDROID_HOME/build-tools/36.0.0/aapt2)"
          APK=out/LearnQuest-test.apk
          "$AAPT2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:" | tee out/CHECK.txt
          grep -q "targetSdkVersion:'36'" out/CHECK.txt || { echo "::error::The app must target Android 16 (API 36) for Google Play"; exit 1; }
          grep -q "name='com.learnquest.junglerun'" out/CHECK.txt || { echo "::error::Unexpected package name"; exit 1; }
          ls -la out | tee -a out/CHECK.txt
          if [ "$SIGNED" = "yes" ]; then
            jarsigner -verify out/LearnQuest-release.aab | head -3 | tee -a out/CHECK.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LearnQuest-android
          path: out/
          retention-days: 30
