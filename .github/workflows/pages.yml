# Publishes the game to GitHub Pages every time you push to the main branch.
# One-time setup in your repository:  Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Live address afterwards:  https://<your-user>.github.io/<repository-name>/
name: Deploy LearnQuest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (three.js only)
        run: npm ci --omit=dev --ignore-scripts
      - name: Refresh the offline file list
        run: node scripts/build-pwa.mjs
      - name: Build the site
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          node scripts/build-pages.mjs --base "$BASE" --out site
      - name: Check the site (paths, files, offline list)
        run: node scripts/test-pages.mjs site "$BASE"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
