<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Child Login — LearnQuest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .auth-wrap { max-width: 420px; margin: 40px auto; padding: 0 20px; width: 100%; }
  .critter-row { text-align: center; font-size: 2.4rem; margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="leaf-badge">🌿</span><span data-i18n="app_name">LearnQuest</span></a>
      <div class="lang-switch">
        <button data-lang="en">EN</button>
        <button data-lang="hi">हि</button>
        <button data-lang="mr">मर</button>
      </div>
    </header>

    <div class="auth-wrap">
      <div class="card">
        <div class="critter-row">🦁🐵🦜</div>
        <h2 class="center" data-i18n="child_login_title">Enter the Jungle</h2>
        <form id="childLoginForm">
          <div class="field">
            <label data-i18n="child_login_id_label">Your Child ID</label>
            <input type="text" id="childId" placeholder="child_xxxxxxxxxx" required>
          </div>
          <div class="field">
            <label data-i18n="child_login_pin_label">4-digit PIN</label>
            <input type="password" id="childPin" inputmode="numeric" maxlength="4" pattern="\d{4}" required>
          </div>
          <div id="loginError" class="error-text hidden" data-i18n="child_login_error"></div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="child_login_button">Let's Go!</button>
        </form>
        <p class="center muted mt-24" data-i18n="child_login_no_id" style="font-size:0.85rem;">Don't have an ID? Ask your grown-up to create your profile.</p>
      </div>
    </div>
  </div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById("childLoginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("loginError");
    errEl.classList.add("hidden");
    try {
      const data = await api.childLogin({
        childId: document.getElementById("childId").value.trim(),
        pin: document.getElementById("childPin").value.trim(),
      });
      saveSession(data.token, "child");
      setLang(data.child.language);
      window.location.href = "dashboard.html";
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove("hidden");
    }
  });
</script>
</body>
</html>
